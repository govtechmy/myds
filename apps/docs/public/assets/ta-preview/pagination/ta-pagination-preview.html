<!doctype html>
<html lang="en" class="dark">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
    <!-- <link rel="stylesheet" href="../css-reset.css" /> -->
    <link rel="stylesheet" href="pagination.css" />
    <link rel="stylesheet" href="pagination-dark.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        "message",
        (event) => {
          if (event.origin !== window.origin) return;
          if (event.data?.theme) {
            document.documentElement.className = event.data.theme;
            console.log("Theme applied inside iframe:", event.data.theme);
          }
        },
        false,
      );
    </script>
  </head>
  <body>
    <!-- Simple Type Pagination -->
    <nav class="pagination-myds">
      <ul style="padding: 0px">
        <li>
          <button
            class="button-myds button-myds-secondary simple"
            id="prevSimpleBtn"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g id="Icon/chevron-left">
                <path
                  id="Vector 146"
                  d="M11 5L6 10L11 15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
            Previous
          </button>
        </li>
        <li>
          <button
            class="button-myds button-myds-secondary simple"
            id="nextSimpleBtn"
          >
            Next
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g id="Icon/chevron-right">
                <path
                  id="Vector 146"
                  d="M8 5L13 10L8 15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Default Type Pagination -->
    <nav class="pagination-myds">
      <ul id="pagination-list" style="padding: 0px">
        <li>
          <button class="button-myds button-myds-secondary" id="prevDefaultBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g id="Icon/chevron-left">
                <path
                  id="Vector 146"
                  d="M11 5L6 10L11 15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
          </button>
        </li>
        <!-- Page number will be generated here -->
        <li>
          <button class="button-myds button-myds-secondary" id="nextDefaultBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g id="Icon/chevron-right">
                <path
                  id="Vector 146"
                  d="M8 5L13 10L8 15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Full Type Pagination -->
    <nav class="pagination-myds">
      <ul class="full" style="padding: 0px">
        <li class="current-page-number" id="page-info">Page 2 of 20</li>
        <li>
          <button
            class="button-myds button-myds-secondary simple"
            id="prevFullBtn"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g id="Icon/chevron-left">
                <path
                  id="Vector 146"
                  d="M11 5L6 10L11 15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
            Previous
          </button>
        </li>
        <li>
          <button
            class="button-myds button-myds-secondary simple"
            id="nextFullBtn"
          >
            Next
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g id="Icon/chevron-right">
                <path
                  id="Vector 146"
                  d="M8 5L13 10L8 15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
          </button>
        </li>
      </ul>
    </nav>
  </body>
  <script src="pagination.js"></script>
</html>
