<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
    <link rel="stylesheet" href="../css-reset.css" />
    <link rel="stylesheet" href="input.css" />
    <link rel="stylesheet" href="input-dark.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener("message", (event) => {
        if (event.origin !== window.origin) return;
        if (event.data?.theme) {
          document.documentElement.className = event.data.theme;
          console.log("Theme applied inside iframe:", event.data.theme);
        }
      }, false);
    </script>
    
  </head>
  <body>
    <main class="page-center">
      <div class="button-grid">
        <!-- Primary -->
        <button class="button-myds button-myds-primary">Default</button>
        <button class="button-myds button-myds-primary">Hover</button>
        <button class="button-myds button-myds-primary">Focused</button>
        <button disabled class="button-myds button-myds-primary">
          Disabled
        </button>
      </div>
    </main>
  </body>
</html>
